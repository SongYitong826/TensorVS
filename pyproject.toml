[project]
name = "tensorvs"
version = "0.1.0"
description = "Tensor-based vector search and IVF index built on flash-kmeans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.26.0",
  "tqdm",
]

[project.optional-dependencies]
triton = ["triton>=2.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tensorvs", "flash_kmeans"]

[tool.setuptools.package-dir]
tensorvs = "src/tensorvs"
flash_kmeans = "flash-kmeans/flash_kmeans"

[tool.setuptools.package-data]
flash_kmeans = ["kernels/*"]
